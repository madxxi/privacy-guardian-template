jurisdiction: GB
label: "United Kingdom — UK GDPR & DPA 2018"
country_code: GB

frameworks:

  - code: UK_GDPR
    name: "UK GDPR (post-Brexit)"
    statute: "UK GDPR + Data Protection Act 2018"
    notes: "Functionally mirrors EU GDPR but enforced independently since Jan 2021."
    rights:
      - "Right to erasure (Article 17 UK GDPR)"
      - "Right of access (Article 15)"
      - "Right to object to direct marketing (absolute)"
      - "Right to data portability"
    response_deadline: "One calendar month"
    enforcement:
      - agency: "Information Commissioner's Office (ICO)"
        url: "https://ico.org.uk/make-a-complaint"
    damages: "Up to £17.5M or 4% of global turnover (whichever is higher)"
    private_right_of_action: true
    citation_template: >
      Pursuant to Article 17 of the UK General Data Protection Regulation and
      the Data Protection Act 2018, I hereby request the erasure of all personal
      data concerning me. Please respond within one calendar month. If you decline,
      I will lodge a complaint with the Information Commissioner's Office (ICO).
