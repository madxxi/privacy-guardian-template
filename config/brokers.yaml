  # ── FLORIDA-SPECIFIC PUBLIC RECORDS ──────────────────────────────────────

  - name: "Broward County Property Appraiser"
    url: "https://www.bcpa.net/RecInfo.asp"
    optout_url: "https://www.bcpa.net/RecInfo.asp"
    optout_method: mail
    phone: "(954) 357-6830"
    legal_basis: FL_PRA
    compliant: true
    notes: "Property ownership is public record in FL. Homestead confidentiality available only for law enforcement, judges, and similar protected occupations under FL 119.071. Confirm eligibility with attorney."

  - name: "Broward County Clerk of Courts"
    url: "https://www.browardclerk.org/Web2/CaseSearchECA/"
    optout_url: ""
    optout_method: unknown
    phone: "(954) 831-6565"
    legal_basis: FL_PRA
    compliant: false
    notes: "Court records are public. Sealing/expungement requires court petition (FL Rule 2.420). Civil records generally cannot be sealed without cause. Attorney review required."

  - name: "FL Division of Elections (Voter Registration)"
    url: "https://registration.elections.myflorida.com/CheckVoterStatus"
    optout_url: "https://dos.myflorida.com/elections/for-voters/voter-registration/"
    optout_method: form
    phone: "(850) 245-6200"
    legal_basis: FL_PRA
    compliant: true
    notes: "FL Statute 97.0585 allows confidentiality for certain protected individuals. General public is not eligible for full suppression, but some fields (address) can be protected for law enforcement, domestic violence victims, etc."

  - name: "FL Dept of Highway Safety (DHSMV)"
    url: ""
    optout_url: "https://www.flhsmv.gov/driver-licenses-id-cards/privacy-concerns/"
    optout_method: mail
    phone: "(850) 617-2000"
    legal_basis: FL_DPPA
    compliant: true
    notes: "Driver records protected under DPPA. DMV data cannot be sold for marketing. If found on a broker, that is a DPPA violation — strong legal basis."

  - name: "Collier County Property Appraiser"
    url: "https://www.collierappraiser.com/"
    optout_url: ""
    optout_method: unknown
    phone: "(239) 252-8141"
    legal_basis: FL_PRA
    compliant: false
    notes: "Naples-area property records. Same FL 119.071 rules as Broward. Attorney review for any suppression request."

