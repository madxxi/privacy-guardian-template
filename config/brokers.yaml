# =============================================================================
# privacy-guardian — brokers.yaml
# =============================================================================
# Known data brokers with search URLs, opt-out instructions, and legal flags.
# Placeholders: {first} {last} {city} {state} {zip}
# legal_basis: CCPA | FCRA | GLBA | FL_DPPA | FL_PRA | NONE
# optout_method: form | email | mail | phone | unknown
# compliant: true = has a working opt-out process; false = no clear process
# phone: customer support / privacy department number (leave blank if unknown)
#        Format: "(800) 555-1234" — include area code, no country prefix needed
# =============================================================================

brokers:

